pipeline:
  test-and-package:
    image: rust:bookworm
    commands:
      - apt-get update && apt-get install -y --no-install-recommends build-essential libasound2-dev libgtk-4-dev libadwaita-1-dev pkg-config
      - cargo test -- --nocapture
      - make dist

  publish-release:
    image: plugins/gitea-release
    settings:
      api_key:
        from_secret: codeberg_token
      base_url: https://codeberg.org
      files:
        - dist/*.tar.gz
        - dist/*.sha256
    when:
      event: tag
