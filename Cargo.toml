[package]
name = "mgame-solo"
version = "1.0.0"
edition = "2021"
authors = ["btw"]
description = "Production-grade companion software and mixer control center for M-Audio M-Game Solo on Linux"
license = "GPL-3.0-or-later"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
libadwaita = { version = "0.7", features = ["v1_5"] }
glib = "0.20"
gio = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nix = { version = "0.29", features = ["poll", "fs"] }
log = "0.4"
env_logger = "0.11"
directories = "6.0"
async-channel = "2.3"

[dev-dependencies]
tempfile = "3.17"
