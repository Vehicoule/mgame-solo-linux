name: Release & Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  tarball:
    name: Build Standalone Tarball
    runs-on: codeberg-medium
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        run: |
          if ! command -v cargo &>/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libasound2-dev \
            libgtk-4-dev \
            libadwaita-1-dev \
            pkg-config

      - name: Build & Test Release Package
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          make dist
          cargo test --release -- --nocapture

      - name: Upload Tarball Artifact
        uses: actions/upload-artifact@v3
        with:
          name: mgame-solo-tarball
          path: |
            dist/*.tar.gz
            dist/*.sha256

  flatpak:
    name: Build Flatpak Bundle
    runs-on: codeberg-medium
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flatpak & Flatpak Builder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            flatpak \
            flatpak-builder \
            elfutils

      - name: Set up Flathub repo
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo || true

      - name: Build Flatpak Bundle
        run: |
          flatpak-builder --disable-rofiles-fuse --user --install-deps-from=flathub --repo=repo --force-clean build-dir com.mgame.Solo.yml
          flatpak build-bundle repo mgame-solo.flatpak com.mgame.Solo

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v3
        with:
          name: mgame-solo-flatpak
          path: mgame-solo.flatpak

  snap:
    name: Build Snap Package
    runs-on: codeberg-medium
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies & Snapcraft
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-pip \
            cargo \
            rustc \
            libasound2-dev \
            libgtk-4-dev \
            libadwaita-1-dev \
            pkg-config
          sudo pip3 install --break-system-packages snapcraft

      - name: Build Snap Package
        run: |
          snapcraft --destructive-mode

      - name: Upload Snap Artifact
        uses: actions/upload-artifact@v3
        with:
          name: mgame-solo-snap
          path: "*.snap"
