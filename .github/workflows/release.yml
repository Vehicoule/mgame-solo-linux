name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tarball:
    name: Standalone tarball
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev

      - name: Verify tag matches crate version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version v$version"
            exit 1
          fi

      - name: Run tests
        run: cargo test --release --locked

      - name: Build tarball
        run: make dist ARCH=x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils

      - name: Generate vendored cargo sources
        run: |
          pip3 install --quiet aiohttp tomlkit pyyaml
          curl -fsSL -o flatpak-cargo-generator.py \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/737c0085912f9f7dabf9341d4608e2a77a51a73a/cargo/flatpak-cargo-generator.py
          python3 flatpak-cargo-generator.py Cargo.lock -o generated-sources.json
          rm flatpak-cargo-generator.py

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: mgame-solo.flatpak
          manifest-path: com.mgame.Solo.yml
          cache-key: flatpak-${{ hashFiles('Cargo.lock') }}

      - name: Print build logs on failure
        if: failure()
        run: |
          find .flatpak-builder -name '*.log' -print 2>/dev/null | while read -r f; do
            echo "::group::$f"
            tail -n 150 "$f"
            echo "::endgroup::"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: mgame-solo.flatpak
          if-no-files-found: error

  snap:
    name: Snap package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Snap package
        uses: snapcore/action-build@v1
        id: snapcraft

      - name: Print build logs on failure
        if: failure()
        run: |
          for f in "$HOME"/.local/state/snapcraft/log/*.log; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            tail -n 200 "$f"
            echo "::endgroup::"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: snap
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tarball, flatpak, snap]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Use stable asset names
        run: |
          cd artifacts
          rm -f *.sha256
          mv mgame-solo-v*-x86_64-linux.tar.gz mgame-solo-x86_64-linux.tar.gz
          mv mgame-solo_*_amd64.snap mgame-solo_amd64.snap
          sha256sum mgame-solo-x86_64-linux.tar.gz > mgame-solo-x86_64-linux.tar.gz.sha256

      - name: Attach packages to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/mgame-solo-x86_64-linux.tar.gz
            artifacts/mgame-solo-x86_64-linux.tar.gz.sha256
            artifacts/mgame-solo.flatpak
            artifacts/mgame-solo_amd64.snap
