name: Release & Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  tarball:
    name: Build Standalone Tarball
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libasound2-dev \
            libgtk-4-dev \
            libadwaita-1-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run test suite
        run: cargo test -- --nocapture

      - name: Build release tarball
        run: |
          make dist

      - name: Upload Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mgame-solo-tarball
          path: |
            dist/*.tar.gz
            dist/*.sha256

  flatpak:
    name: Build Flatpak Bundle
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-builder-lint:latest
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Flatpak Bundle
        run: |
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo || true
          flatpak-builder --repo=repo --force-clean build-dir com.mgame.Solo.yml
          flatpak build-bundle repo mgame-solo.flatpak com.mgame.Solo

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mgame-solo-flatpak
          path: mgame-solo.flatpak

  snap:
    name: Build Snap Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Snap
        uses: snapcore/action-build@v1
        id: snapcraft

      - name: Upload Snap Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mgame-solo-snap
          path: ${{ steps.snapcraft.outputs.snap }}
