name: mgame-solo
base: core24
adopt-info: mgame-solo
summary: Audio mixer control center for M-Audio M-Game Solo
description: |
  Companion software and mixer control center for the M-Audio M-Game Solo
  streaming audio interface. Provides real-time fader synchronization,
  PipeWire channel routing, mic processing DSP, voice effects and LED
  theme configuration.

grade: stable
confinement: strict

apps:
  mgame-solo:
    command: bin/mgame-solo
    extensions: [gnome]
    plugs:
      - audio-playback
      - audio-record
      - alsa
      - raw-usb

parts:
  mgame-solo:
    plugin: nil
    source: .
    parse-info:
      - share/metainfo/com.mgame.Solo.metainfo.xml
    build-snaps:
      - rustup/latest/stable
    build-packages:
      - build-essential
      - pkg-config
      - libgtk-4-dev
      - libadwaita-1-dev
    override-pull: |
      craftctl default
      version="$(sed -n 's/^version = "\(.*\)"/\1/p' "$CRAFT_PART_SRC/Cargo.toml" | head -n1)"
      test -n "$version"
      craftctl set version="$version"
    override-build: |
      set -eu
      # The gnome extension exports the SDK snap's LD_LIBRARY_PATH, whose
      # old glibc breaks the rustup snap binaries. We build against the
      # apt -dev packages instead; runtime libs are still staged by the
      # extension.
      unset LD_LIBRARY_PATH
      export PATH="/snap/bin:$PATH"
      export RUSTUP_TOOLCHAIN=stable
      rustc --version
      cargo --version
      cargo build --release --locked
      install -Dm755 target/release/mgame-solo \
        "$CRAFT_PART_INSTALL/bin/mgame-solo"
      install -Dm644 data/com.mgame.Solo.desktop \
        "$CRAFT_PART_INSTALL/share/applications/com.mgame.Solo.desktop"
      install -Dm644 data/com.mgame.Solo-128.png \
        "$CRAFT_PART_INSTALL/share/icons/hicolor/128x128/apps/com.mgame.Solo.png"
      install -Dm644 data/com.mgame.Solo.metainfo.xml \
        "$CRAFT_PART_INSTALL/share/metainfo/com.mgame.Solo.metainfo.xml"
