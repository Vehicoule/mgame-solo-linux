app-id: com.mgame.Solo
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: mgame-solo

# Skip the AppStream metadata compose stage. It is only needed when
# hosting the app in an OSTree repository (e.g. publishing to Flathub);
# for directly-installed .flatpak bundles it adds a fragile dependency
# on the SDK's appstream/mediaworker tooling.
appstream-compose: false

finish-args:
  # Wayland and X11 display access
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # PulseAudio & PipeWire audio control access
  - --socket=pulseaudio
  # Hardware ALSA RawMIDI & USB access
  - --device=all
  # System sound notifications
  - --talk-name=org.freedesktop.Notifications

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/mgame-solo/cargo
    CARGO_NET_OFFLINE: 'true'

modules:
  - name: mgame-solo
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo build --offline --release --verbose
      - install -Dm755 target/release/mgame-solo /app/bin/mgame-solo
      - install -Dm644 data/com.mgame.Solo.desktop /app/share/applications/com.mgame.Solo.desktop
      - install -Dm644 data/com.mgame.Solo.svg /app/share/icons/hicolor/scalable/apps/com.mgame.Solo.svg
      - install -Dm644 data/com.mgame.Solo-128.png /app/share/icons/hicolor/128x128/apps/com.mgame.Solo.png
      - install -Dm644 data/com.mgame.Solo.metainfo.xml /app/share/metainfo/com.mgame.Solo.metainfo.xml
    sources:
      - type: dir
        path: .
      # Generated by CI from Cargo.lock via flatpak-cargo-generator.py:
      #   python3 flatpak-cargo-generator.py Cargo.lock -o generated-sources.json
      - generated-sources.json
